/* Match the cards and controls on the home page. */
#settings-dialog .settings-section {
  margin: 12px 0 0;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #f8fafc;
}
#settings-dialog .settings-section h3 { margin-top: 0; }
#settings-dialog .master-picker { align-items: flex-end; }
#settings-dialog .master-picker select,
#settings-dialog .master-picker .plus-button,
#settings-dialog #property-city { height: 48px; }
#settings-dialog .master-add {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
#settings-dialog #property-city-form .field { margin: 0 0 10px; }
#settings-dialog #property-city-form button { width: 100%; }
@media (max-width: 350px) {
  #settings-dialog .settings-section { padding: 14px; }
}

/* Keep touch controls and modal forms usable on small and short screens. */
.modal { box-sizing: border-box; overscroll-behavior: contain; }
.modal-body { overflow-wrap: anywhere; }
.modal-header > :first-child, .modal-actions > * { min-width: 0; }
.modal-actions { flex-wrap: wrap; }
:where(input, select, textarea, button) { scroll-margin-block: 72px 20px; }
#account-data-list .settings-section > strong { flex: 1; min-width: 0; }
#account-data-list .settings-section > button { flex: 0 0 auto; }

@media (max-width: 640px) {
  html, body, main, #app { background-color: #f1f5f9 !important; }
  header { padding-block: calc(10px + env(safe-area-inset-top, 0px)) 10px; }
  header .brand-copy { flex: 1; }
  .header-row { gap: 8px; }
  .brand { font-size: 19px; }
  .subtitle { font-size: 13px; }
  main { padding-top: 16px; }
  h1 { font-size: 22px; }
  .identity-panel, .checklist-panel, #settings-dialog .settings-section { background: #fff; }
  .identity-panel { padding: 14px; }
  .field { margin-bottom: 16px; }
  input, select, textarea { font-size: 16px; }
  .checklist-position-picker { padding: 14px 14px 0; }
  .checklist-panel .item { padding: 16px 14px; }
  .check-progress { padding-inline: 10px; border-radius: 8px; }
  .check-top-actions { flex-wrap: nowrap; }
  .position-chip, .master-delete, .small-button, .request-actions button { min-height: 44px; }
  .master-delete { margin-top: 4px; }
  .modal {
    width: min(600px, calc(100% - 24px));
    max-height: min(calc(100dvh - 24px), calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 16px));
    margin: auto auto max(12px, env(safe-area-inset-bottom, 0px));
    border-radius: 16px;
  }
  .modal-body { padding: 0 16px 16px; }
  .modal-header {
    position: sticky;
    top: 0;
    z-index: 1;
    align-items: center;
    margin: 0 0 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    background: #fff;
  }
  .modal-header h2 { margin: 0; font-size: 18px; }
  .modal-header > button { flex-shrink: 0; }
  .modal-actions > button { flex: 1 1 110px; }
  #property-picker .choice { margin-block: 6px; }
}

@media (max-width: 360px) {
  .modal-body { padding-inline: 12px; }
  .account-credential { flex-wrap: wrap; }
  .account-credential strong { flex-basis: auto; }
  .master-picker { gap: 6px; }
}

@media (max-height: 480px) and (orientation: landscape) {
  .check-progress, .modal-header { position: static; }
}
.password-toggle{display:grid;place-items:center;flex:0 0 48px;width:48px;padding:0}
.password-toggle .password-slash{display:none}
.password-toggle[data-visible] .password-slash{display:block}
</style>
</head><body>
<header><div class="inner header-row"><div class="brand-copy"><div class="brand">D'PARAGON</div><div class="subtitle">Room Material Inspection</div></div><button type="button" class="settings-button hidden" id="open-settings" aria-label="Pengaturan master data" title="Pengaturan">⚙</button><button type="button" class="settings-button hidden" id="logout" aria-label="Keluar" title="Keluar">↪</button></div></header>
<main id="auth-app" class="hidden"><section class="identity-panel"><h1>Masuk DPARAGON DCIP</h1><form id="login-form"><div class="field"><label for="login-id">ID pengguna</label><input id="login-id" name="username" autocomplete="username" required></div><div class="field"><label for="login-password">Kata sandi</label><div class="location-control"><input id="login-password" name="password" type="password" autocomplete="current-password" required><button type="button" class="secondary password-toggle" id="toggle-login-password" aria-controls="login-password" aria-label="Tampilkan kata sandi" title="Tampilkan kata sandi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/><path class="password-slash" d="M3 3l18 18"/></svg></button></div></div><p id="login-error" class="error" role="alert"></p><button class="full">Masuk</button></form></section></main>
<main id="app" class="hidden"></main>
<dialog id="create-account-dialog" class="modal" aria-labelledby="create-account-title">
  <div class="modal-body">
    <div class="modal-header"><h2 id="create-account-title">Buat Akun</h2></div>
    <form id="create-form">
<div class="field"><label for="staff-name">Nama petugas</label>
<input id="staff-name" name="displayName" minlength="2" maxlength="80" required></div>
<div class="field"><label for="staff-id">ID pengguna</label>
<input id="staff-id" name="username" autocomplete="off" pattern="[A-Za-z0-9][A-Za-z0-9._\-]{2,31}" required></div>
<div class="field"><label for="staff-password">Kata sandi</label>
<input id="staff-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></div>
<div class="field"><label for="staff-division">Divisi</label><select id="staff-division" name="divisionId" required></select></div>
<div class="field"><label for="staff-city">Kota</label><select id="staff-city" name="city" required></select></div>
<fieldset id="property-picker"><legend>Akses properti</legend></fieldset>
<p id="create-account-status" role="status" class="small" hidden></p><div class="modal-actions"><button type="button" class="secondary" data-close-dialog>Tutup</button><button type="submit">Buat Akun</button></div>
</form>
  </div>
</dialog>
<dialog id="account-success-dialog" class="modal" aria-labelledby="account-success-title">
  <div class="modal-body">
    <div class="modal-header"><div><h2 id="account-success-title">Akun Berhasil Dibuat</h2><p class="muted">Salin informasi ini untuk dikirim kepada petugas.</p></div></div>
    <div class="account-credential"><strong>ID :</strong><span id="account-success-id"></span></div>
    <div class="account-credential"><strong>PASSWORD :</strong><span id="account-success-password"></span></div>
    <p id="account-copy-status" class="small good" role="status" hidden></p>
    <div class="modal-actions"><button type="button" class="secondary" id="close-account-success">Tutup</button><button type="button" id="copy-account-credentials">Salin untuk WhatsApp</button></div>
  </div>
</dialog>
<dialog id="account-data-dialog" class="modal" aria-labelledby="account-data-title">
  <div class="modal-body">
    <div class="modal-header"><h2 id="account-data-title">Data Akun</h2><button type="button" class="secondary" id="close-account-data">Tutup</button></div>
    <p id="account-data-status" role="status" class="small"></p>
    <div id="account-data-list"></div>
  </div>
</dialog>
<dialog id="account-edit-dialog" class="modal" aria-labelledby="account-edit-title">
  <div class="modal-body">
    <div class="modal-header"><h2 id="account-edit-title">Edit Akun</h2><button type="button" class="secondary" id="close-account-edit">Tutup</button></div>
    <form id="account-edit-form">
      <div class="field"><label for="account-edit-name">Nama petugas</label><input id="account-edit-name" name="displayName" required minlength="2" maxlength="80"></div>
      <div class="field"><label for="account-edit-division">Divisi</label><select id="account-edit-division" name="divisionId" required></select></div>
      <fieldset id="account-edit-properties"><legend>Akses properti</legend></fieldset><p id="account-edit-status" role="status" class="small"></p>
      <div class="modal-actions"><button type="submit">Simpan</button><button type="button" class="danger-button" id="delete-account">Hapus</button></div>
    </form>
  </div>
</dialog>
<dialog id="settings-dialog" class="modal" aria-labelledby="settings-title"></dialog>

<dialog id="checklist-tools" class="modal" aria-labelledby="checklist-tools-title"></dialog>
<dialog id="request-dialog" class="modal" aria-labelledby="request-title"></dialog>
<script>

async function runAccountDataAction(status, work) {
  if (accountDataBusy) return;
  accountDataBusy = true;
  const controls = status === accountEditStatus ? accountEditForm : accountDataList;

  status.classList.remove('error');
  try {
    await work();

    status.textContent = error.message;
    status.classList.add('error');
  } finally {
    controls.inert = false;
    accountDataBusy = false;
  }
}

async function initializeApp(){locationPositionStatuses=[];catalogRequests=[];try{await loadMasterData();}catch(err){settingsNotice='Gagal memuat master data dari database.';}render();syncHistory(true);}

// Supabase is the source of truth for master data and inspections.
const rmisLive = true;
let rmisMaster = [], rmisCatalog = [], divisionPositions = [];
const divisionPositionRows = id => {
  const assigned = new Set(divisionPositions.filter(row => row.division_id === id).map(row => row.position_id));
  return rmisType('KODE_POSISI').filter(row => assigned.has(row.master_id));
};
const divisionPositionNames = id => divisionPositionRows(id).map(row => row.name);
let dcipApi;
let activeProfile;
const isDivisionAdmin = () => activeProfile?.role === 'sub_admin';
const canManageDcip = () => activeProfile?.role === 'admin' || isDivisionAdmin();
const rmisCall = (name, ...args) => dcipApi[name](...args);
const rmisType = type => rmisMaster.filter(r => r.master_type === type);
const rmisFind = (type, id) => rmisType(type).find(r => r.master_id === id);
const rmisPosition = name => rmisType('KODE_POSISI').find(r => r.name === name);
const rmisLocation = () => locations.find(r => r.key === makeLocationKey(s.property, s.areaPosition, s.room));
const rmisOptions = name => rmisCatalog.filter(r =>
  r.division_code === s.division && r.position_code_id === rmisPosition(name)?.master_id
);
function rmisGroups(name) {
  const items = new Map();
  for (const r of rmisOptions(name)) {
    if (r.item_retired) continue;
    if (!items.has(r.item_id)) items.set(r.item_id, [r.item_id, r.item_order + '. ' + r.item_name, []]);
    if (!r.retired && !['Lainnya', 'Tidak Ada', 'Belum diketahui'].includes(r.option_value)) items.get(r.item_id)[2].push(r.option_value);
  }
  return items.size ? [{name, items:[...items.values()]}] : [];
}
if (rmisLive) {
  positionCodes = [];
  areaPositions = [];
  loadMasterData = async function () {
    ({master:rmisMaster, katalog:rmisCatalog, divisionPositions} = await rmisCall('rmisMuat'));
    divisions = rmisType('DIVISI').map(r => ({id:r.master_id, name:r.name}));
    if (activeProfile?.role !== 'admin' && activeProfile?.division_id) {
      divisions = divisions.filter(d => d.id === activeProfile.division_id);
      s.division = divisions[0]?.id || '';
    }
    props = rmisType('PROPERTI').map(r => ({id:r.master_id, name:r.name, city:r.city}));
    if (!canManageDcip()) {
      const cities = cityChoices();
      if (cities.length === 1) s.city = cities[0];
      const accessible = props.filter(p => (p.city || unassignedCity) === s.city);
      if (accessible.length === 1) s.property = accessible[0].id;
    }
    areaPositions = rmisType('AREA').map(r => r.name);
    positionCodes = divisionPositionNames(s.division);
    locations = rmisType('LOKASI').map(r => {
      const areaPosition = rmisFind('AREA', r.parent_area_id)?.name;
      return {id:r.master_id, propertyId:r.parent_property_id, areaPosition, name:r.name,
        key:makeLocationKey(r.parent_property_id, areaPosition, r.name)};
    }).filter(r => r.areaPosition);
  };
  const existingSaved = savedPositionRecords;
  savedPositionRecords = function () {
    return existingSaved().filter(r => r.divisionId === s.division);
  };
  const existingAvailable = availablePositionCodes;
  availablePositionCodes = () => existingAvailable().filter(name => !locationPositionStatuses.some(row => row.status === 'TIDAK_TERDAPAT' && rmisFind('KODE_POSISI', row.position_id)?.name === name));
  const existingStatus = positionStatus;
  positionStatus = () => !checking && !storageError &&
    !rmisCatalog.some(r => r.division_code === s.division)
    ? '<p class="muted">Katalog checklist untuk divisi ini belum tersedia.</p>'
    : existingStatus();
  readMockRecords = async function () {
    if (!s.division) return [];
    const division = s.division;
    const locationId = rmisLocation()?.id || '';
    const [rows,statuses] = await Promise.all([division?rmisCall('rmisBacaInspeksi', division, locationId):[],locationId?rmisCall('rmisBacaStatusPosisi', locationId, division):[]]);
    locationPositionStatuses = statuses || [];
    const byId = new Map();
    for (const r of rows) {
      const id = r.inspection_id;
      if (!byId.has(id)) byId.set(id, {
        key:id, divisionId:division, division:rmisFind('DIVISI', division)?.name || division,
        propertyId:r.property_id, property:rmisFind('PROPERTI', r.property_id)?.name || r.property_id,
        areaPosition:rmisFind('AREA', r.area_id)?.name || r.area_id, room:r.location_name,
        position:r.position_name || rmisFind('KODE_POSISI', r.position_code_id)?.name || r.position_code_id,
        time:r.updated_at, data:{}
      });
      byId.get(id).data[r.item_id] = {spec:r.option_value, custom:r.custom_specification};
    }
    return [...byId.values()];
  };
  syncHistory = async function () {

  async function kirim(record, inspectionId) {

      option_id: opsi.find(r => r.item_id === itemId && r.option_value === jawaban.spec)?.option_id || '',

      inspection_id:inspectionId, answers

  }
  addMockRecord = record => kirim(record, '');
  putMockRecord = record => kirim(record, record.key);

    const grup = [

      ['DIVISI', divisions, nextDivisions], ['KODE_POSISI', positionCodes, nextCodes]

      const baru = sesudah.find(v => !sebelum.some(old => nama(old) === nama(v)));

        return;
      }

        const id = hapus.id || rmisType(type).find(r => r.name === nama(hapus))?.master_id;
        await rmisCall('rmisUbahMaster', type, 'hapus', id);
        rmisMaster = rmisMaster.filter(r => r.master_id !== id &&
          !(r.master_type === 'LOKASI' && (r.parent_area_id === id || r.parent_property_id === id)));
        return;
      }
    }
  };
  deleteCurrentLocation = async function () {
    const location = rmisLocation();
    if (!location || deletingLocation) return;
    if (!confirm('Hapus lokasi "' + location.name + '" beserta checklist yang tersimpan untuk semua divisi?')) return;
    deletingLocation = true; locationDeleteError = ''; ++syncSeq; render();

    }
  };

    try {
      await loadMasterData();
      await syncHistory();
    } catch (err) {
      root.textContent = err.message || 'Gagal memuat database RMIS.';
    }
  };
}

async function startAuthenticatedApp() {
  const authApp = document.getElementById('auth-app');
  const app = document.getElementById('app');
  const settingsButton = document.getElementById('open-settings');
  const {createDcipApi} = await import('./dcip-api.js?v=audit-pagination');
  dcipApi = await createDcipApi();
  async function showSession() {
    const profile = await dcipApi.currentProfile();
    activeProfile = profile;
    authApp.classList.toggle('hidden', !!profile);
    app.classList.toggle('hidden', !profile);
    settingsButton.classList.toggle('hidden', !canManageDcip());
    document.getElementById('logout').classList.toggle('hidden', !profile);
    if (profile) await initializeApp();
  }
  const passwordToggle = document.getElementById('toggle-login-password');
  const loginPassword = document.getElementById('login-password');
  function setLoginPasswordVisible(visible) {
    loginPassword.type = visible ? 'text' : 'password';
    const label = visible ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi';
    passwordToggle.toggleAttribute('data-visible', visible);
    passwordToggle.setAttribute('aria-label', label);
    passwordToggle.title = label;
  }
  passwordToggle.addEventListener('click', () => setLoginPasswordVisible(loginPassword.type === 'password'));
  document.getElementById('login-form').addEventListener('submit', async event => {
    event.preventDefault();
    const form = event.currentTarget;
    const button = form.querySelector('button');
    button.disabled = true;
    document.getElementById('login-error').textContent = '';
    try {
      await dcipApi.signIn(form.username.value, form.password.value);
      form.password.value = '';
      setLoginPasswordVisible(false);
      await showSession();
    } catch (error) {
      document.getElementById('login-error').textContent = error.message;
    } finally { button.disabled = false; }
  });
  document.getElementById('logout').addEventListener('click', async () => {
    await dcipApi.signOut();
    s = {page:'home',division:'',property:'',areaPosition:'',room:'',position:'',cat:0,data:{},note:'',history:[]};
    await showSession();
  });
  await showSession();
}
startAuthenticatedApp().catch(error => {
  document.getElementById('auth-app').classList.remove('hidden');
  document.getElementById('login-error').textContent = error.message;
});
